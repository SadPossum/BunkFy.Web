name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Verify
        run: pnpm verify

      - name: Record Windows socket and memory state
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize, FreePhysicalMemory |
            ConvertTo-Json -Compress
          Get-NetTCPConnection | Group-Object State, OwningProcess |
            Sort-Object Count -Descending | Select-Object -First 15 Name, Count |
            ConvertTo-Json -Compress
          netsh int ipv4 show dynamicport tcp

  validate:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both operating systems
        shell: pwsh
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if ($env:VERIFY_RESULT -ne 'success') {
            throw 'Web verification failed on at least one operating system.'
          }
